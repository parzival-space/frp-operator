on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*' # match pre-release tags like v1.0.0-alpha, v1.0.0-beta, etc.

env:
  CI_CHART_REPO: helm
  CI_IMAGE_NAME: frp-operator
  CI_IMAGE_PLATFORMS: |
    linux/amd64
#    linux/arm64

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
      - name: Setup Helm
        uses: azure/setup-helm@v5.0.0
      - name: Setup Rust
        run: rustup toolchain install stable
      - name: Validate Cargo Workspace Version
        run: |
          # check if cargo workspace version matches tag
          cargo_version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          if [[ "$cargo_version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::Cargo workspace version ($cargo_version) does not match tag (${GITHUB_REF_NAME#v})"
            exit 1
          fi
      - name: Validate Helm Chart App-Version
        run: |
          # check if Helm chart appVersion matches tag
          chart_version=$(helm show chart chart/ | grep '^appVersion:' | awk '{print $2}')
          if [[ "$chart_version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::Helm chart appVersion ($chart_version) does not match tag (${GITHUB_REF_NAME#v})"
            exit 1
          fi
      - name: Validate Helm Chart Version
        run: |
          # check if helm chart with this version already exists
          if helm pull oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ env.CI_CHART_REPO }}/${{ env.CI_IMAGE_NAME }}:${GITHUB_REF_NAME#v} > /dev/null 2>&1; then
            echo "::error::Helm chart with version ${GITHUB_REF_NAME#v} already exists in the registry"
            exit 1
          fi
      - name: Run Cargo Tests
        run: cargo test --workspace --all-features
      - name: Generate CRD YAML
        run: cargo run --bin crdgen -p frp-operator-api -- chart/crds/generated.yaml
      - name: Validate Helm Chart
        run: helm lint chart
      - name: Validate Helm Chart with CRDs
        run: helm template chart --include-crds

  docker-image:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v4.0.0
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        id: image-tags
        shell: bash
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/${{ env.CI_IMAGE_NAME }}:${{ github.ref_name }}"
            if [[ "${{ github.ref_name }}" == *"-"* ]]; then
              echo "ghcr.io/${{ github.repository_owner }}/${{ env.CI_IMAGE_NAME }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push Docker images
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          platforms: ${{ env.CI_IMAGE_PLATFORMS }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ steps.image-tags.outputs.tags }}

  helm-chart:
    needs: docker-image # Ensure the Docker image is published before the Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
      - name: Setup Helm
        uses: azure/setup-helm@v5.0.0
      - name: Setup Rust
        run: rustup toolchain install stable
      - name: Login to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
      - name: Generate CRD YAML
        run: cargo run --bin crdgen -p frp-operator-api -- chart/crds/generated.yaml
      - name: Package Helm Chart
        run: helm package chart --destination dist
      - name: Publish Helm Chart
        run: helm push dist/frp-operator-*.tgz oci://ghcr.io/${{ github.repository_owner }}/helm